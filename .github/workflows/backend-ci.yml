name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @crm/backend lint
      - run: pnpm --filter @crm/backend typecheck
      - run: pnpm --filter @crm/backend build
      - run: pnpm --filter @crm/backend test
