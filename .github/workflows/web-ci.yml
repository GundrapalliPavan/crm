name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches: [main]
    paths:
      - "apps/web/**"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @crm/types build

      - run: pnpm --filter @crm/web lint
      - run: pnpm --filter @crm/web typecheck
      - run: pnpm --filter @crm/web build
