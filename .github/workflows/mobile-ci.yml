name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @crm/mobile lint
      - run: pnpm --filter @crm/mobile typecheck
